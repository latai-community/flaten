# Directory to flatten recursively
source.dir=sample_project

# Output file that will contain all flattened text content
generation.file=FLAT_root.flat

# File that stores summary information (files included, ignored, failed, size, etc.)
summary.file=summary.log
output.flat.file=output.flat

# File where processing errors are logged
error.file=logErrorFlat.log

# File containing ignore rules (extensions, paths, directories)
ignoreList.file=ignoreBinaryList.flatIgnore

# Encoding to use when reading/writing text files
encoding=UTF-8

# Delimiter between blocks in the flat file
delimiter.line=----------------x----------------

# Delimiter between path and file content
delimiter.context=++++++++++++++++++++++++++